# Pedestrian crossing: a generic, self-contained L2R example.
#
# Behavior (states, inputs, transitions, invariants, message meaning) lives in the
# Lean project under spec/. This file owns only structure: which components exist,
# how they nest, which state each one owns, who may message whom, and where the
# Rust code goes. Every Lean name below is resolved against lean-inventory.json.

schema = "l2r.architecture/v0"

[system]
id = "crossing"
name = "Pedestrian crossing"
rust_crate = "crossing_scaffold"
lean_inventory = "lean-inventory.json"
output_dir = "scaffold"

[[component]]
id = "crossing"
name = "Crossing controller"
profile = "composite/v0"
responsibility = "Composes the request latch and the signal; delivers messages between them in a deterministic order. Owns no behavioral state of its own."
rust_module = "crossing"

[[component]]
id = "request_latch"
name = "Request latch"
parent = "crossing"
profile = "transition-core/v0"
responsibility = "Remembers that a pedestrian has asked to cross until the signal acknowledges the request."
rust_module = "request_latch"
notes = "Keep the transition function pure: no clocks, I/O or shared state."
implementation_budget_lines = 60

[component.behavior]
owned_state = "Crossing.Latch.State"
input = "Crossing.Latch.Input"
output = "Crossing.Latch.Output"
init = "Crossing.Latch.init"
step = "Crossing.Latch.step"
invariants = [
  "Crossing.Latch.pending_press_is_silent",
  "Crossing.Latch.request_implies_pending",
]

[[component]]
id = "signal"
name = "Crossing signal"
parent = "crossing"
profile = "transition-core/v0"
responsibility = "Cycles vehicle and pedestrian phases; pedestrians may walk only after the vehicle phase has passed through amber."
rust_module = "signal"
notes = "Timer expiry arrives as an input; the signal never reads a clock itself."
implementation_budget_lines = 60

[component.behavior]
owned_state = "Crossing.Signal.State"
input = "Crossing.Signal.Input"
output = "Crossing.Signal.Output"
init = "Crossing.Signal.init"
step = "Crossing.Signal.step"
invariants = [
  "Crossing.Signal.no_conflicting_release",
  "Crossing.Signal.walk_entered_from_amber",
]

[[message]]
id = "latch_to_signal"
from = "request_latch"
to = "signal"
translation = "Crossing.Routes.latchToSignal"

[[message]]
id = "signal_to_latch"
from = "signal"
to = "request_latch"
translation = "Crossing.Routes.signalToLatch"
